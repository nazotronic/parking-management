apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-service-deployment
  labels:
    app: parking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-service
  template:
    metadata:
      labels:
        app: parking-service
    spec:
      containers:
      - name: parking-service
        image: parking-service:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: DB_HOST
          value: "mysql-service"
---
apiVersion: v1
kind: Service
metadata:
  name: parking-service
spec:
  type: NodePort
  selector:
    app: parking-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
      nodePort: 30082
